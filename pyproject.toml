[project]
name = "cadenza"
version = "0.0.0"
description = "Cadenza — plataforma de digitalización asistida de partituras"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = []

# La raíz es un proyecto virtual: gobierna el workspace y la configuración global.
[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/api",
    "packages/domain",
    "packages/learning",
    "packages/omr",
    "packages/persistence",
    "packages/validation",
]

# ---------------------------------------------------------------------------
# Configuración única de calidad (un solo punto de verdad del repositorio).
# ---------------------------------------------------------------------------

[dependency-groups]
dev = [
    "cadenza-api",
    "cadenza-domain",
    "cadenza-learning",
    "cadenza-omr",
    "cadenza-persistence",
    "cadenza-validation",
    "httpx>=0.27",
    "pytest>=8.2",
    "ruff>=0.6",
    "black>=24.4",
    "mypy>=1.11",
]

[tool.uv.sources]
cadenza-api = { workspace = true }
cadenza-domain = { workspace = true }
cadenza-learning = { workspace = true }
cadenza-omr = { workspace = true }
cadenza-persistence = { workspace = true }
cadenza-validation = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
# El prototipo (backend/frontend) se rige por sus propias herramientas; las
# migraciones de Alembic siguen su propio estilo generado.
extend-exclude = ["backend", "frontend", ".opencode", "packages/persistence/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = '/(backend|frontend|\.opencode|packages/persistence/migrations)/'

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "apps/api/src:packages/domain/src:packages/learning/src:packages/omr/src:packages/persistence/src:packages/validation/src"
explicit_package_bases = true
exclude = '/(backend|frontend|\.opencode|packages/persistence/migrations)/'

[[tool.mypy.overrides]]
module = ["homr", "homr.*", "onnxruntime.*", "cv2.*", "numpy.*", "music21", "music21.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
python_files = ["test_*.py"]
addopts = "-q"
