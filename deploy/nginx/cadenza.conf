# Cadenza en producción (ADR-0023, #156): sirve la interfaz compilada de apps/web y reenvía /api a
# la API quitando el prefijo, como el proxy de desarrollo de Vite (ADR-0019).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # IP real del visitante. Tailscale Funnel termina TLS en el host y reenvía la petición con
    # X-Forwarded-For; desde el contenedor, el host se ve con una dirección privada de Docker. Solo
    # se cree la cabecera si viene de ahí, y se toma su última dirección: la que añadió Funnel, no
    # la que pudiera inventar el cliente.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # POST /transcribe admite imágenes de hasta 20 MB.
    client_max_body_size 21m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # La API se resuelve en cada petición con el DNS de Docker: si su contenedor se recrea con otra
    # dirección, Nginx no se queda con la antigua, y la configuración se valida sin la API en marcha.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Se sustituye cualquier X-Forwarded-For entrante por la IP real ya resuelta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # La transcripción es síncrona (ADR-0016): el cliente espera hasta 30 s.
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Recursos con huella en el nombre: se pueden guardar en caché indefinidamente.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de la interfaz (/, /entrar, /sesiones/…): siempre index.html, sin caché.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
