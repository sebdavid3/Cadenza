# Cadenza en producción (ADR-0023, #156): sirve la interfaz compilada de apps/web y reenvía /api a
# la API (cadenza-proxy.conf).

# Límites por visitante, con la IP real ya resuelta por real_ip. Frenan que alguien pruebe
# contraseñas repartidas entre muchos usuarios (la API cuenta los fallos por IP y usuario) o sature
# la CPU con Argon2 o con transcripciones. La API conserva sus propios límites (ADR-0022).
#
# Como en la API, una IPv6 cuenta por su red /64 (sus cuatro primeros grupos): quien dispone de un
# /64 no esquiva el límite cambiando de dirección. Si la abreviatura «::» cae dentro de esos cuatro
# grupos, cuenta la dirección entera.
map $remote_addr $cadenza_client {
    "~^(?<net>[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){3}):" $net;
    default $remote_addr;
}
limit_req_zone $cadenza_client zone=cadenza_login:10m rate=10r/m;
limit_req_zone $cadenza_client zone=cadenza_register:10m rate=10r/m;
limit_conn_zone $cadenza_client zone=cadenza_transcribe:10m;
limit_req_status 429;
limit_conn_status 429;

# Identificador de cada petición: el que envía la web (#275), para relacionar en el registro de la
# API lo que pidió una misma orden, si tiene la forma que la API acepta; si no, el de Nginx.
map $http_x_request_id $cadenza_request_id {
    "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
    default $request_id;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Rutas con caracteres de control, fuera antes de elegir la location: «/api/auth/login%0A» no
    # coincide con la location exacta ni con sus límites, pero la API la atiende como su login
    # (el «$» de las rutas de Starlette admite un salto de línea final).
    if ($uri ~ "[\x00-\x1f\x7f]") {
        return 400;
    }

    # IP real del visitante. Tailscale Funnel termina TLS en el host y reenvía la petición a
    # 127.0.0.1 con X-Forwarded-For; el contenedor la ve llegar desde la pasarela de su red
    # (10.77.0.1, fijada en docker-compose.prod.yml). Solo se cree la cabecera si viene de ahí, y se
    # toma su última dirección: la que añadió Funnel, no la que pudiera inventar el cliente.
    set_real_ip_from 10.77.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # POST /transcribe admite imágenes de hasta 20 MB.
    client_max_body_size 21m;

    # También las respuestas de la API: el MusicXML de una página y el JSON de una edición, que lo
    # lleva dentro (#275). `gzip_proxied any`, porque Funnel reenvía las peticiones con `Via` y
    # sin él Nginx no comprimiría lo que va a través de un proxy.
    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml
               application/vnd.recordare.musicxml+xml application/xml text/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;
    # OSMD dibuja la partitura con atributos style en el SVG: de ahí 'unsafe-inline' solo en
    # style-src. La imagen original se muestra desde un blob: y las fuentes salen del propio origen.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # La API se resuelve en cada petición con el DNS de Docker: si su contenedor se recrea con otra
    # dirección, Nginx no se queda con la antigua, y la configuración se valida sin la API en marcha.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # La documentación interactiva de la API no se publica: el contrato está en el repositorio.
    location ~ ^/api/(docs|redoc|openapi\.json)(/|$) {
        return 404;
    }

    # Acceso y registro: 10 por minuto y visitante cada uno, con ráfagas de 10, y cuerpos pequeños.
    location = /api/auth/login {
        limit_req zone=cadenza_login burst=10 nodelay;
        client_max_body_size 16k;
        include /etc/nginx/cadenza-proxy.conf;
    }

    location = /api/auth/register {
        limit_req zone=cadenza_register burst=10 nodelay;
        client_max_body_size 16k;
        include /etc/nginx/cadenza-proxy.conf;
    }

    # Como mucho cuatro transcripciones abiertas a la vez por visitante (varias personas pueden
    # compartir una IP en una misma sala).
    location = /api/transcribe {
        limit_conn cadenza_transcribe 4;
        include /etc/nginx/cadenza-proxy.conf;
    }

    location /api/ {
        include /etc/nginx/cadenza-proxy.conf;
    }

    # Recursos con huella en el nombre: se pueden guardar en caché indefinidamente.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Rutas de la interfaz (/, /entrar, /sesiones/…): siempre index.html, sin caché.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
