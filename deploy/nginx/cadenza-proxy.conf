# Reenvío a la API común a todas las location de /api en cadenza.conf: quita el prefijo, como el
# proxy de desarrollo de Vite (ADR-0019).
rewrite ^/api/(.*)$ /$1 break;
proxy_pass $api_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Se sustituyen las cabeceras de reenvío entrantes por la IP real ya resuelta; Forwarded se vacía
# para que nada aguas abajo lea una dirección que haya puesto el cliente.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header Forwarded "";
# El de la web si lo envía bien formado; si no, el de Nginx (map en cadenza.conf).
proxy_set_header X-Request-ID $cadenza_request_id;
# La transcripción es síncrona (ADR-0016): el cliente espera hasta 30 s.
proxy_read_timeout 60s;
proxy_send_timeout 60s;
