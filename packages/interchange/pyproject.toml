[project]
name = "cadenza-interchange"
version = "0.0.0"
description = "Frontera canónica de notación de Cadenza: MusicXML/MEI/**kern <-> ScoreIR (music21)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cadenza-domain", "music21>=10"]

# converter21 aporta a music21 los importadores de Humdrum (**kern) y MEI, que
# usan los corpus de evaluación (PrIMuS en MEI, SMB en **kern).
[project.optional-dependencies]
converters = ["converter21>=4.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
