[project]
name = "cadenza-interchange"
version = "0.0.0"
description = "Frontera canónica de notación de Cadenza: MusicXML/MEI/**kern <-> ScoreIR (music21)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cadenza-application", "cadenza-domain", "music21>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
