[project]
name = "cadenza-omr"
version = "0.0.0"
description = "Adaptador OMR de Cadenza: puerto OMREngine y adaptador HOMR (in-process)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadenza-domain",
    "cadenza-interchange",
    "numpy>=1.26",
    "pillow>=10.0",
]

# Dependencias pesadas de inferencia como extra opcional: la suite de tests y la
# CI usan el doble cadenza.omr.testing.FakeOMREngine y no necesitan modelos, GPU ni
# onnxruntime.
[project.optional-dependencies]
homr = ["homr>=0.7"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
