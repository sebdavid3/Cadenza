[project]
name = "cadenza-persistence"
version = "0.0.0"
description = "Persistencia de Cadenza: sesiones, findings y eventos de edición (SQLAlchemy + JSONB)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadenza-application",
    "cadenza-domain",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
