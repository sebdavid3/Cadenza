[project]
name = "cadenza-validation"
version = "0.0.0"
description = "Motor de validación sintáctica/semántica de Cadenza: reglas puras sobre ScoreDocument."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["cadenza-domain", "music21>=10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
