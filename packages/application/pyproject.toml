[project]
name = "cadenza-application"
version = "0.0.0"
description = "Capa de aplicación hexagonal de Cadenza: casos de uso y puertos de orquestación (ADR-0009)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cadenza-domain",
    "cadenza-omr",
    "cadenza-validation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
