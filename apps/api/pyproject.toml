[project]
name = "cadenza-api"
version = "0.0.0"
description = "API Gateway de Cadenza: transcripción, hallazgos y eventos de edición (FastAPI)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "cadenza-domain",
    "cadenza-omr",
    "cadenza-validation",
    "cadenza-persistence",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cadenza"]
