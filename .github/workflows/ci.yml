name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Sincronizar dependencias
        run: uv sync

      - name: Verificar formateo con Ruff
        run: uv run ruff check .

      - name: Verificar formateo con Black
        run: uv run black --check .

      - name: Verificación de tipos estricta con Mypy
        run: uv run mypy packages apps

      - name: Ejecutar pruebas con Pytest
        run: uv run pytest

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas unitarias con Vitest
        run: npm run test

      - name: Compilar frontend
        run: npm run build
