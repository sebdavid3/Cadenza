name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadenza_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CADENZA_TEST_POSTGRES_URL: postgresql+psycopg2://postgres@localhost:5432/cadenza_test
      CADENZA_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Sincronizar dependencias
        run: uv sync

      - name: Verificar formateo con Ruff
        run: uv run ruff check .

      - name: Verificar formateo con Black
        run: uv run black --check .

      - name: Verificación de tipos estricta con Mypy
        run: uv run mypy packages apps

      # pg_dump y pg_restore de la imagen postgres:16, la misma del servicio: el runner (Ubuntu
      # 26.04) no trae el cliente 16, y uno más nuevo escribe volcados que un servidor 16 no
      # restaura. Los envoltorios montan /tmp, donde pytest deja los archivos de las pruebas (#159).
      - name: pg_dump y pg_restore de PostgreSQL 16 (copias, #159)
        run: |
          docker pull -q postgres:16
          mkdir -p "$HOME/pg16/bin"
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host --user "$(id -u):$(id -g)" -v /tmp:/tmp -e PGPASSWORD postgres:16 %s "$@"\n' "$tool" > "$HOME/pg16/bin/$tool"
            chmod +x "$HOME/pg16/bin/$tool"
          done
          echo "$HOME/pg16/bin" >> "$GITHUB_PATH"
          "$HOME/pg16/bin/pg_dump" --version
          "$HOME/pg16/bin/pg_restore" --version

      - name: Ejecutar pruebas con Pytest
        run: uv run pytest -vv

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint con ESLint
        run: npm run lint

      - name: Verificar formateo con Prettier
        run: npm run format:check

      - name: Ejecutar pruebas con Vitest
        run: npm run test

      - name: Comprobar tipos y construir
        run: npm run build

  docker:
    name: Imágenes Docker de la API y la web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # El Dockerfile falla si la API, HOMR u OpenCV no se pueden importar (#135)
      - name: Construir la imagen de la API
        run: docker build -t cadenza-api:ci .

      # La API corre sin root (D57, #192). Con las restricciones del despliegue y el sistema de
      # archivos de solo lectura salvo /tmp y el HOME del usuario, HOMR transcribe un íncipit.
      - name: Transcribir un íncipit en la imagen de la API, sin root
        run: |
          docker run --rm --read-only --tmpfs /tmp --tmpfs /home/cadenza \
            --cap-drop ALL --security-opt no-new-privileges:true \
            cadenza-api:ci sh -c 'test "$(id -u)" = 10001 && python apps/api/tests/fixtures/transcribe_incipit.py'

      # Compila apps/web y valida la configuración de Nginx con nginx -t (#156)
      - name: Construir la imagen web
        run: docker build -f Dockerfile.web --build-arg VITE_REGISTRATION_ENABLED=true -t cadenza-web:ci .

      # pg_dump y pg_restore de PostgreSQL 16 con el script de copias (#159)
      - name: Construir la imagen de copias de seguridad
        run: |
          docker build -f Dockerfile.backup -t cadenza-backup:ci .
          docker run --rm --entrypoint pg_dump cadenza-backup:ci --version
          docker run --rm cadenza-backup:ci --help

      # Valores generados al vuelo: el compose exige los secretos, pero aquí no se usan.
      - name: Validar el compose de producción
        run: |
          export CADENZA_POSTGRES_PASSWORD="$(openssl rand -hex 16)"
          export CADENZA_AUTH_SECRET_KEY="$(openssl rand -hex 32)"
          export CADENZA_PUBLIC_ORIGIN=https://cadenza.example
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f docker-compose.prod.yml --profile backup config --quiet
