name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cadenza_test
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CADENZA_TEST_POSTGRES_URL: postgresql+psycopg2://postgres@localhost:5432/cadenza_test
      CADENZA_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Configurar Python
        run: uv python install 3.12

      - name: Sincronizar dependencias
        run: uv sync

      - name: Verificar formateo con Ruff
        run: uv run ruff check .

      - name: Verificar formateo con Black
        run: uv run black --check .

      - name: Verificación de tipos estricta con Mypy
        run: uv run mypy packages apps

      - name: Ejecutar pruebas con Pytest
        run: uv run pytest -vv

  frontend:
    name: Frontend (Node 24)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint con ESLint
        run: npm run lint

      - name: Verificar formateo con Prettier
        run: npm run format:check

      - name: Ejecutar pruebas con Vitest
        run: npm run test

      - name: Comprobar tipos y construir
        run: npm run build

  docker:
    name: Imagen Docker de la API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # El Dockerfile falla si la API, HOMR u OpenCV no se pueden importar (#135)
      - name: Construir la imagen de la API
        run: docker build -t cadenza-api:ci .
